name: monitor

# GitHub schedules are best effort: a run can start late or be dropped under load, and the :17 slots of the old 6-hourly cron were
# the busiest of the hour. Every 3 hours at an off-peak minute, so one dropped slot still leaves a look within 6 hours.
#
# The commit this workflow pushes (state/monitor.json only) is made with GITHUB_TOKEN, and GitHub does not start workflows for
# pushes made with it. So fingerprint commits run neither ci nor pages, on purpose: they change no data, no package and no page.
# A change the monitor finds starts refresh.yml, whose own commit is followed by pages (see refresh.yml).
on:
  schedule:
    - cron: '43 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read

# One writer to main at a time: monitor, refresh and refresh-is-standards share this group.
concurrency:
  group: data-writer
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Direct fetch is free. The paid fallback is used only when a source refuses, and only if the secret exists.
      - name: Look at every source
        env:
          ALTERLAB_API_KEY: ${{ secrets.ALTERLAB_API_KEY }}
          ALTERLAB_MAX_USD: '0.10'
        run: python -m pipeline.monitor --report monitor-report.json

      - name: Did a source change?
        id: diff
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          r = json.load(open('monitor-report.json'))
          print('changed=' + ('true' if r['changed'] else 'false'))
          print('ids=' + ','.join(r['changed']))
          PY

      - name: Start the refresh when a source changed
        if: steps.diff.outputs.changed == 'true'
        env:
          CHANGED_IDS: ${{ steps.diff.outputs.ids }}
        run: |
          echo "changed: ${CHANGED_IDS}"
          gh workflow run refresh.yml

      - name: Commit the new state
        run: |
          set -euo pipefail
          git add state/monitor.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "data-monitor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(monitor): source fingerprints $(date -u +%Y-%m-%dT%H:%MZ)"
          # A rejected push changed nothing, so retrying it is safe.
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 5))
          done
          echo "could not push the monitor state after 3 attempts" >&2
          exit 1

      - name: Open or update an issue when the monitor itself fails
        if: failure()
        run: |
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          .github/scripts/report-issue.sh "run-${GITHUB_RUN_ID}" "Source monitor failed" "The source change monitor failed. Run: ${url}"
