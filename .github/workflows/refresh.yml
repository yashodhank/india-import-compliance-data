name: refresh

on:
  schedule:
    - cron: '30 20 * * 0'   # Monday 02:00 IST (Sunday 20:30 UTC)
  workflow_dispatch:
    inputs:
      dry_run:
        description: fetch and parse everything, report what would change, write, commit and release nothing
        type: boolean
        default: false
      publish:
        description: cut a release from the current tree even when the fetch changed nothing (every test gate still runs first)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: data-writer
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install poppler (PDF lists) and pytest
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install -r requirements-dev.txt

      # The policy lives in the pipeline: a fetch error, a parse failure, a parsed count that differs from the source's own count, or a
      # list that shrinks by more than half exits non-zero and writes nothing. This step is allowed to fail, and nothing after it runs then.
      - name: Fetch, parse, assert, write
        env:
          ALTERLAB_API_KEY: ${{ secrets.ALTERLAB_API_KEY }}
          ALTERLAB_MAX_USD: '0.25'
          REFRESH_DEBUG_DIR: refresh-debug
          DRY_RUN: ${{ inputs.dry_run && 'yes' || '' }}
        run: python -m pipeline.refresh ${DRY_RUN:+--dry-run} --report refresh-report.json --changelog-md changelog-entry.md

      # The bodies of sources that answered without the expected structure, so the next failure is readable without a laptop.
      - name: Upload the bodies of failed sources
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: refresh-debug
          path: refresh-debug/
          retention-days: 7
          if-no-files-found: ignore

      - name: Verify the rebuilt tree (schemas, invariants, golden tests)
        run: python -m pytest tests -q

      - name: Did anything change?
        id: diff
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          r = json.load(open('refresh-report.json'))
          assert r['status'] == 'ok', r
          print('changed=' + ('true' if r.get('changed') else 'false'))
          print('publish=' + ('true' if (r.get('changed') or '${{ inputs.publish }}' == 'true') else 'false'))
          PY
          git status --short | head -20

      - name: Commit, changelog entry and release
        if: steps.diff.outputs.publish == 'true' && !inputs.dry_run
        run: |
          set -euo pipefail
          TAG="v$(date -u +%Y.%m.%d)"
          if gh release view "$TAG" >/dev/null 2>&1; then TAG="${TAG}.$(date -u +%H%M)"; fi
          python .github/scripts/release_prep.py "$TAG" "$(date -u +%Y-%m-%d)" changelog-entry.md
          git config user.name "data-refresh"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python packages/sync.py
          python -m pipeline.datapackage
          git add -A data raw packages CHANGELOG.md CITATION.cff datapackage.json
          git commit -m "data: weekly refresh $TAG" -m "$(cat changelog-entry.md)"
          git pull --rebase origin main
          git push origin HEAD:main
          python -m pipeline.assets dist
          (cd dist && sha256sum -- * > ../SHA256SUMS && mv ../SHA256SUMS SHA256SUMS)
          gh release create "$TAG" --title "$TAG" --notes-file changelog-entry.md dist/*
          # Pushes made with GITHUB_TOKEN start no workflow, so publish the site explicitly (pages runs ci first).
          gh workflow run pages.yml

      - name: Report stale sources on the issue
        if: success() && !inputs.dry_run
        run: |
          set -euo pipefail
          body="$(python - <<'PY'
          import json
          r = json.load(open('refresh-report.json'))
          for x in r.get('stale') or []:
              print('source %s stale since %s: %s' % (x['file'], x['since'], x['reason']))
          PY
          )"
          if [ -z "$body" ]; then exit 0; fi
          extra="$(python - <<'PY'
          import json
          r = json.load(open('refresh-report.json'))
          print('refresh-escalated' if any(x.get('escalate') for x in r.get('stale') or []) else '')
          PY
          )"
          # Same stale sources as an earlier run: already on the issue, so say nothing.
          key="stale-$(printf '%s' "$body" | sha256sum | cut -c1-16)"
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          .github/scripts/report-issue.sh "$key" "Source stale in the weekly refresh" "${body}

          The last good data was kept and the other sources were refreshed. Run: ${url}" "$extra"

      - name: Open or update an issue on failure
        if: failure() && !inputs.dry_run
        run: |
          reason="$(python - <<'PY'
          import json
          try:
              print(json.load(open('refresh-report.json')).get('reason', 'a later step failed; see the run log'))
          except Exception:
              print('the run failed before a report was written; see the run log')
          PY
          )"
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          .github/scripts/report-issue.sh "run-${GITHUB_RUN_ID}" "Weekly refresh failed" "The weekly refresh failed and published nothing.

          Reason: ${reason}

          Run: ${url}"
