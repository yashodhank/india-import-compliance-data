name: ci

# Also called by pages.yml, so a site is never published from a tree that has not passed these same steps.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Bundled package data matches data/ (fails with the command that fixes it)
        run: python packages/sync.py --check
      - name: Install poppler (PDF lists) and pytest
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install -r requirements-dev.txt ruff
      - name: Pipeline consistency check (needs pipeline/check.py from the pipeline audit PR)
        run: python -m pipeline.check
      - name: Lint pipeline and tests
        run: ruff check pipeline tests
      - name: Tests, golden files and schema validation of every published CSV
        run: python -m pytest tests -q
      - name: Count the tests that ran
        run: python -m pytest tests --collect-only -q | tail -1
      - name: Python package tests
        run: cd packages/python && python -m unittest discover -s tests -v
      - name: Node package tests
        # `npm test` runs `node --test test/`, which Node 22 reads as a module path and fails
        run: cd packages/node && node --test
