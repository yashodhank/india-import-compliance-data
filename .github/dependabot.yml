version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: pip
    directory: /packages/python
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /packages/node
    schedule:
      interval: monthly
